name: fs-spike

on:
  push:
    branches: ['arena/**']
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe fs.com reachability from runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 fs-info-archive-bot/1.0"
          {
          for u in "https://www.fs.com/robots.txt" "https://www.fs.com/sitemap.xml" "https://www.fs.com/sitemap_of_All_Products.xml.gz" "https://www.fs.com/sitemap_of_Products_Detail.xml.gz" "https://www.fs.com/sitemap_of_Blogs.xml.gz"; do
            out=$(curl -sS -L --max-time 90 -A "$UA" -w "CODE=%{http_code} SIZE=%{size_download} TIME=%{time_total}" -o /tmp/x.bin "$u" 2>/dev/null && echo "$out" || echo "FAILED")
            echo "$u -> $out"
            head -c 200 /tmp/x.bin 2>/dev/null | tr '\n' ' ' | head -c 200; echo
          done
          } | tee /tmp/probe.txt
      - name: Try pushing probe output to spike-out branch
        run: |
          git config user.email "arena-bot@users.noreply.github.com"
          git config user.name "arena-bot"
          git checkout -B spike-out
          mkdir -p .spike
          cp /tmp/probe.txt .spike/probe.txt
          git add .spike/probe.txt
          git commit -m "spike probe $(date -u +%s)" --allow-empty || true
          git push -f origin spike-out 2>&1 | tail -3
          echo "PUSH_EXIT=$?"
      - uses: actions/upload-artifact@v4
        with:
          name: fs-spike-probe
          path: /tmp/probe.txt
          if-no-files-found: error
